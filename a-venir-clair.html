<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AXXA, page à venir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&amp;display=swap">
<link rel="stylesheet" href="./proto.css">
<style>
:root{--bg:#ffffff;--ink:#1d1d1f;--mute:#6e6e73;--line:#d2d2d7;--cta:#0071a8;--cta-ink:#ffffff;--chip:#f5f5f7}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1272px;box-sizing:border-box;margin:0 auto;padding:0 24px;height:80px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.bar>a:first-child,.end{flex:1 1 0;display:flex;align-items:center;min-height:44px}
.end{justify-content:flex-end;gap:8px}
.nav-links{display:flex;gap:4px;padding:4px;border-radius:999px;border:1px solid var(--line);font-size:14px}
.nav-links a{padding:8px 16px;border-radius:999px;font-weight:500;white-space:nowrap;color:var(--mute)}
.nav-links a:hover{color:var(--ink)}
@media (max-width:820px){.nav-links{display:none}}
.icon{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--ink);cursor:pointer}
main{max-width:720px;margin:0 auto;padding:160px 24px 200px;text-align:center}
.tag{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:16px}
h1{margin:0;font-size:clamp(40px,7vw,64px);line-height:1.05;letter-spacing:-.03em;font-weight:600}
p{margin:24px auto 0;max-width:520px;font-size:19px;line-height:1.5;color:var(--mute)}
.actions{margin-top:40px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{min-height:48px;padding:0 24px;border-radius:999px;display:inline-flex;align-items:center;font-size:17px;font-weight:500;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-family:inherit}
.btn.primary{background:var(--cta);border-color:var(--cta);color:var(--cta-ink)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a href="accueil-clair.html" aria-label="AXXA, accueil"><img src="./assets/eb92cd5ae8f61b02740bc728cee41089.png" alt="AXXA" style="height:16px;width:auto;display:block"></a>
    <nav class="nav-links" aria-label="Principale"><a href="accueil-clair.html">Accueil</a><a href="catalogue-clair.html">Boutique</a><a href="fonctionnement-clair.html">Fonctionnement</a><a href="application-clair.html">Application</a><a href="entreprises-clair.html">Entreprises</a></nav>
    <div class="end">
      <a href="a-venir-sombre.html" class="icon proto-theme proto-theme--bar" data-theme-to="sombre" aria-label="Passer au thème sombre" title="Passer au thème sombre"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5Z"></path></svg></a>
      <a href="a-venir-clair.html?p=panier" class="icon" aria-label="Panier"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7Z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg></a>
      <button type="button" class="icon" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 9h16M4 15h16"></path></svg></button>
    </div>
  </div>
</header>
<main>
  <span class="tag">Prototype</span>
  <h1 id="titre">Page à venir</h1>
  <p id="texte">Cette page fait partie de la prochaine étape du design.</p>
  <div class="actions">
    <button type="button" class="btn" onclick="history.length > 1 ? history.back() : location.assign('accueil-clair.html')">Retour</button>
    <a class="btn primary" href="catalogue-clair.html">Voir la boutique</a>
  </div>
</main>
<script>
(function () {
  var pages = {"panier": ["Panier", "Le panier et le paiement seront dessinés à la prochaine étape, avec le montage Shopify."], "faq": ["Questions fréquentes", "La page complète des questions arrive avec les pages de soutien."], "composante": ["Fiche d'une composante", "Les fiches des composantes à l'unité (sonde, règle, valve, etc.) sont la prochaine page à dessiner."], "documents": ["Documents à télécharger", "Les fiches techniques et les guides en PDF seront ajoutés quand Gilles les aura fournis."], "plombiers": ["Plombiers partenaires", "Le programme de plombiers partenaires est encore à confirmer."], "rabais": ["Calculateur de rabais d'assurance", "Le calculateur arrive avec la page Assurance et crédits."], "general": ["Page à venir", "Cette page fait partie de la prochaine étape du design."]};
  var key = new URLSearchParams(location.search).get('p') || 'general';
  var d = pages[key] || pages.general;
  document.getElementById('titre').textContent = d[0];
  document.getElementById('texte').textContent = d[1];
  document.title = 'AXXA, ' + d[0].toLowerCase();
  var t = document.querySelector('.proto-theme');
  t.href += location.search;
})();
</script>
<script src="./proto.js" data-page="a-venir" data-theme="clair"></script>
</body>
</html>
